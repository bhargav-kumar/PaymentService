spring.application.name=paymentservice
spring.config.import=optional:configserver:

# 1. Enable the H2 console engine
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 2. Database connection configurations
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 3. Hibernate translation flags
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. FIX: Use local loopback forwarding via Gateway properties
spring.cloud.gateway.mvc.routes[0].id=h2-console-route
spring.cloud.gateway.mvc.routes[0].uri=forward:///h2-console
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/h2-console/**
